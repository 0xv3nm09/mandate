# Render blueprint — web service (serves API + built console) for Mandate
# Deploy: push this repo → Render → New → Blueprint → point at the repo.
services:
  - type: web
    name: mandate
    runtime: node
    plan: free
    rootDir: .
    buildCommand: |
      cd web && npm install && npm run build &&
      cd ../server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MANDATE_SIGNING_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DB_PATH
        value: /tmp/mandate.db
      - key: MANDATE_ADMIN_TOKEN
        sync: false        # required on public deployments: guards every mutating route
      - key: PAYPAL_SANDBOX_RECIPIENT
        sync: false        # sandbox personal account email (invoice sends + payout settlement)
      - key: PAYPAL_INVOICER_NAME
        sync: false        # invoicer identity on real invoices
      - key: PAYPAL_INVOICER_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false        # optional: e.g. https://0xv3nm09.github.io
