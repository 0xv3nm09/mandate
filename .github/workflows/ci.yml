name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Server — install + typecheck
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
      - name: Server — boot + health + hard-block probe (mock gateway, zero keys)
        working-directory: server
        run: |
          npx tsx src/index.ts &
          for i in $(seq 1 20); do curl -sf localhost:8787/api/health && break || sleep 1; done
          curl -sf localhost:8787/api/health
          # the guardrail must hold in CI too: off-policy payout is deterministically blocked
          curl -s -X POST localhost:8787/api/usecases/UC-04/run | grep -q '"outcome":"block"' \
            && echo "UC-04 blocked as expected" \
            || { echo "UC-04 did not block"; exit 1; }
          curl -s localhost:8787/api/audit/verify | grep -q '"ok":true' \
            && echo "audit chain verified" \
            || { echo "audit chain broken"; exit 1; }
      - name: Web — install + typecheck + build
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
